p("15. Roots of a quadratic equation",String.raw`
#include <stdio.h>
#include <math.h>   /* compile with: gcc file.c -lm */
int main() {
    float a, b, c, d, r1, r2;
    printf("Enter a, b, c: ");
    scanf("%f %f %f", &a, &b, &c);
    d = b * b - 4 * a * c;
    if (d > 0) {
        r1 = (-b + sqrt(d)) / (2 * a);
        r2 = (-b - sqrt(d)) / (2 * a);
        printf("Real and distinct roots: %.2f, %.2f\n", r1, r2);
    } else if (d == 0) {
        r1 = -b / (2 * a);
        printf("Real and equal roots: %.2f\n", r1);
    } else {
        printf("Complex roots: %.2f + %.2fi, %.2f - %.2fi\n",
               -b / (2 * a), sqrt(-d) / (2 * a),
               -b / (2 * a), sqrt(-d) / (2 * a));
    }
    return 0;
}`,String.raw`

p("19. First n prime numbers",String.raw`
#include <stdio.h>
int main() {
    int n, count = 0, num = 2, i, isPrime;
    printf("How many primes? ");
    scanf("%d", &n);
    while (count < n) {
        isPrime = 1;
        for (i = 2; i * i <= num; i++) {
            if (num % i == 0) { isPrime = 0; break; }
        }
        if (isPrime) {
            printf("%d ", num);
            count++;
        }
        num++;
    }
    printf("\n");
    return 0;
}`,String.raw`

    return n * fact(n - 1);

#include <stdio.h>
int main() {
    int a[50], n, i, pos, x;
    printf("Enter size: ");
    scanf("%d", &n);
    printf("Enter elements: ");
    for (i = 0; i < n; i++)
        scanf("%d", &a[i]);
    printf("Enter position (1-%d) and element: ", n + 1);

        printf("%d ", a[i]);

p("40. Elapsed time between two dates (structures)",String.raw`
#include <stdio.h>
struct Date { int d, m, y; };
int daysIn(int m, int y) {
    int days[] = {31,28,31,30,31,30,31,31,30,31,30,31};
    if (m == 2 && ((y % 4 == 0 && y % 100 != 0) || y % 400 == 0))
        return 29;
    return days[m - 1];
}
int main() {
    struct Date d1, d2, r;
    printf("Earlier date (DD/MM/YYYY): ");
    scanf("%d/%d/%d", &d1.d, &d1.m, &d1.y);
    printf("Later date (DD/MM/YYYY): ");
    scanf("%d/%d/%d", &d2.d, &d2.m, &d2.y);
    if (d2.d < d1.d) {
        d2.d += daysIn(d1.m, d1.y);
        d2.m--;
    }
    if (d2.m < d1.m) {
        d2.m += 12;
        d2.y--;
    }
    r.d = d2.d - d1.d;
    r.m = d2.m - d1.m;
    r.y = d2.y - d1.y;
    printf("Elapsed: %d years, %d months, %d days\n", r.y, r.m, r.d);
    return 0;
}`,String.raw`

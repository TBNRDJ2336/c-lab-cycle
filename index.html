const programs = [
{title:"Leap year check",category:"Conditions",algo:["Start.","Read the year.","If the year is divisible by 400, or divisible by 4 but not by 100, mark it as a leap year.","Otherwise, mark it as a common year.","Display the result and stop."],flow:{type:"decision",input:"Read year",condition:"Divisible by 400, or by 4 but not 100?",yes:"Print ‘leap year’",no:"Print ‘not a leap year’"},code:`#include <stdio.h>\n\nint main(void) {\n    int year;\n    printf("Enter a year: ");\n    if (scanf("%d", &year) != 1) return 1;\n\n    if (year % 400 == 0 || (year % 4 == 0 && year % 100 != 0))\n        printf("%d is a leap year\\n", year);\n    else\n        printf("%d is not a leap year\\n", year);\n    return 0;\n}`},
{title:"Odd or even",category:"Conditions",algo:["Start.","Read an integer n.","If n is divisible by 2, display even; otherwise, display odd.","Stop."],flow:{type:"decision",input:"Read n",condition:"Is n % 2 equal to 0?",yes:"Display even",no:"Display odd"},code:`#include <stdio.h>\n\nint main(void) {\n    int n;\n    printf("Enter an integer: ");\n    if (scanf("%d", &n) != 1) return 1;\n\n    if (n % 2 == 0)\n        printf("%d is even\\n", n);\n    else\n        printf("%d is odd\\n", n);\n    return 0;\n}`},
{title:"Voting eligibility",category:"Conditions",algo:["Start.","Read the candidate’s age in years.","If age is at least 18, display eligible; otherwise, display not eligible.","Stop."],flow:{type:"decision",input:"Read age",condition:"Is age at least 18?",yes:"Display eligible",no:"Display not eligible"},code:`#include <stdio.h>\n\nint main(void) {\n    int age;\n    printf("Enter age in years: ");\n    if (scanf("%d", &age) != 1 || age < 0) return 1;\n\n    if (age >= 18)\n        printf("Eligible to vote\\n");\n    else\n        printf("Not eligible to vote\\n");\n    return 0;\n}`},
{title:"Reverse a three-digit number",category:"Number logic",algo:["Start.","Read a positive three-digit integer.","Take the last digit with n % 10 and append it to the reversed value.","Remove the last digit with integer division by 10; repeat until no digits remain.","Display the reversed number and stop."],flow:{type:"loop",init:"Set reverse = 0",condition:"Is n greater than 0?",body:"digit = n % 10; reverse = reverse × 10 + digit",update:"n = n / 10",done:"Print reverse"},code:`#include <stdio.h>\n\nint main(void) {\n    int n, original, reverse = 0;\n    printf("Enter a positive three-digit integer: ");\n    if (scanf("%d", &n) != 1 || n < 100 || n > 999) {\n        printf("Input must be from 100 to 999.\\n");\n        return 1;\n    }\n    original = n;\n    while (n > 0) {\n        reverse = reverse * 10 + n % 10;\n        n /= 10;\n    }\n    printf("Reverse of %d is %d\\n", original, reverse);\n    return 0;\n}`},
{title:"Circle and rectangle measurements",category:"Formulas",algo:["Start.","Read the circle radius and rectangle length and width.","Calculate circle area = πr².","Calculate rectangle area = length × width and perimeter = 2(length + width).","Display all three results and stop."],flow:["Start","Read radius, length, width","Calculate πr², length × width, and 2(length + width)","Display circle area, rectangle area, and perimeter","Stop"],code:`#include <stdio.h>\n\nint main(void) {\n    const double pi = 3.141592653589793;\n    double radius, length, width;\n    printf("Enter circle radius: ");\n    if (scanf("%lf", &radius) != 1 || radius < 0) return 1;\n    printf("Enter rectangle length and width: ");\n    if (scanf("%lf %lf", &length, &width) != 2 || length < 0 || width < 0) return 1;\n\n    printf("Circle area = %.2f\\n", pi * radius * radius);\n    printf("Rectangle area = %.2f\\n", length * width);\n    printf("Rectangle perimeter = %.2f\\n", 2 * (length + width));\n    return 0;\n}`},
{title:"Simple interest",category:"Formulas",algo:["Start.","Read principal, annual rate (percent), and time (years).","Calculate simple interest = principal × rate × time / 100.","Display the interest and total amount; stop."],flow:["Start","Read principal, rate, and time","Interest = principal × rate × time / 100","Display interest and principal + interest","Stop"],code:`#include <stdio.h>\n\nint main(void) {\n    double principal, rate, time, interest;\n    printf("Enter principal, annual rate (%%), and time in years: ");\n    if (scanf("%lf %lf %lf", &principal, &rate, &time) != 3 ||\n        principal < 0 || rate < 0 || time < 0) return 1;\n\n    interest = principal * rate * time / 100.0;\n    printf("Simple interest = %.2f\\n", interest);\n    printf("Total amount = %.2f\\n", principal + interest);\n    return 0;\n}`},
{title:"Largest of three numbers",category:"Conditions",algo:["Start.","Read a, b, and c.","Assume a is largest; compare b and then c with the current largest.","Display the largest value and stop."],flow:{type:"decision",input:"Read a, b, c",condition:"Which value is greatest?",yes:"Keep the greatest value",no:"Update greatest value",tail:"Print greatest"},code:`#include <stdio.h>\n\nint main(void) {\n    int a, b, c, largest;\n    printf("Enter three integers: ");\n    if (scanf("%d %d %d", &a, &b, &c) != 3) return 1;\n\n    largest = a;\n    if (b > largest) largest = b;\n    if (c > largest) largest = c;\n    printf("Largest = %d\\n", largest);\n    return 0;\n}`},
{title:"Negative of a number",category:"Number logic",algo:["Start.","Read a number n.","Calculate its additive inverse, −n.","Display the result and stop."],flow:["Start","Read n","Set result = −n","Display result","Stop"],code:`#include <stdio.h>\n\nint main(void) {\n    double n;\n    printf("Enter a number: ");\n    if (scanf("%lf", &n) != 1) return 1;\n    printf("Negative of the number = %.2f\\n", -n);\n    return 0;\n}`},
{title:"Sum of digits",category:"Number logic",algo:["Start.","Read an integer n; set sum to 0 and use the magnitude of n.","While n is greater than 0, add n % 10 to sum and remove the last digit.","Display sum and stop."],flow:{type:"loop",init:"Set sum = 0; use |n|",condition:"Is n greater than 0?",body:"sum = sum + (n % 10)",update:"n = n / 10",done:"Print sum"},code:`#include <stdio.h>\n\nint main(void) {\n    long long n, value, sum = 0;\n    printf("Enter an integer: ");\n    if (scanf("%lld", &n) != 1) return 1;\n    value = (n < 0) ? -n : n;\n\n    while (value > 0) {\n        sum += value % 10;\n        value /= 10;\n    }\n    printf("Sum of digits = %lld\\n", sum);\n    return 0;\n}`},
{title:"Electricity bill",category:"Conditions",algo:["Start.","Read customer number and units consumed.","Apply the applicable slab formula: 0–200 at ₹0.50/unit; 201–400: ₹100 plus ₹0.65 per unit above 200; 401–600: ₹230 plus ₹0.80 above 400; above 600: ₹390 plus ₹1.00 above 600.","Display customer number and amount due; stop."],flow:{type:"multi",input:"Read customer number and units",condition:"Choose the applicable unit slab",arms:["0–200 units: 0.50 × units","201–400: 100 + 0.65 × excess","401–600: 230 + 0.80 × excess","Above 600: 390 + 1.00 × excess"],tail:"Print customer number and bill"},note:"The tariff is applied progressively by slab, exactly as described in the lab sheet. A rupee symbol is used in the explanation; the program prints the amount as a decimal.",code:`#include <stdio.h>\n\nint main(void) {\n    long long customer;\n    int units;\n    double bill;\n    printf("Enter customer number and units consumed: ");\n    if (scanf("%lld %d", &customer, &units) != 2 || units < 0) return 1;\n\n    if (units <= 200)\n        bill = units * 0.50;\n    else if (units <= 400)\n        bill = 100.0 + (units - 200) * 0.65;\n    else if (units <= 600)\n        bill = 230.0 + (units - 400) * 0.80;\n    else\n        bill = 390.0 + (units - 600) * 1.00;\n\n    printf("Customer %lld: amount due = Rs. %.2f\\n", customer, bill);\n    return 0;\n}`},
{title:"Swap two numbers",category:"Fundamentals",algo:["Start.","Read a and b.","Save a in a temporary variable; copy b to a and the saved value to b.","Display the swapped values and stop."],flow:["Start","Read a and b","temp = a; a = b; b = temp","Display a and b","Stop"],code:`#include <stdio.h>\n\nint main(void) {\n    int a, b, temp;\n    printf("Enter two integers: ");\n    if (scanf("%d %d", &a, &b) != 2) return 1;\n\n    temp = a;\n    a = b;\n    b = temp;\n    printf("After swapping: a = %d, b = %d\\n", a, b);\n    return 0;\n}`},
{title:"Student grading",category:"Conditions",algo:["Start.","Read a mark from 0 to 100.","Select a grade using descending minimum-mark thresholds.","Display the grade and stop."],flow:{type:"multi",input:"Read mark (0–100)",condition:"Find the mark band",arms:["90–100: A","80–89: B","70–79: C","60–69: D","50–59: E","Below 50: F"],tail:"Print grade"},note:"The lab sheet does not specify grading bands. This example uses A ≥ 90, B ≥ 80, C ≥ 70, D ≥ 60, E ≥ 50, and F below 50; change the thresholds to match your institution.",code:`#include <stdio.h>\n\nint main(void) {\n    int mark;\n    char grade;\n    printf("Enter mark (0-100): ");\n    if (scanf("%d", &mark) != 1 || mark < 0 || mark > 100) return 1;\n\n    if (mark >= 90) grade = 'A';\n    else if (mark >= 80) grade = 'B';\n    else if (mark >= 70) grade = 'C';\n    else if (mark >= 60) grade = 'D';\n    else if (mark >= 50) grade = 'E';\n    else grade = 'F';\n\n    printf("Grade = %c\\n", grade);\n    return 0;\n}`},
{title:"Smallest of three numbers",category:"Conditions",algo:["Start.","Read a, b, and c.","Assume a is smallest; replace it when b or c is smaller.","Display the smallest value and stop."],flow:{type:"decision",input:"Read a, b, c",condition:"Which value is smallest?",yes:"Keep the smallest value",no:"Update smallest value",tail:"Print smallest"},code:`#include <stdio.h>\n\nint main(void) {\n    int a, b, c, smallest;\n    printf("Enter three integers: ");\n    if (scanf("%d %d %d", &a, &b, &c) != 3) return 1;\n\n    smallest = a;\n    if (b < smallest) smallest = b;\n    if (c < smallest) smallest = c;\n    printf("Smallest = %d\\n", smallest);\n    return 0;\n}`},
{title:"Absolute value",category:"Number logic",algo:["Start.","Read a number n.","If n is negative, set n to −n; otherwise leave it unchanged.","Display the absolute value and stop."],flow:{type:"decision",input:"Read n",condition:"Is n less than 0?",yes:"Set n = −n",no:"Keep n unchanged",tail:"Print |n|"},code:`#include <stdio.h>\n\nint main(void) {\n    double n;\n    printf("Enter a number: ");\n    if (scanf("%lf", &n) != 1) return 1;\n    if (n < 0) n = -n;\n    printf("Absolute value = %.2f\\n", n);\n    return 0;\n}`},
{title:"Roots of a quadratic equation",category:"Number logic",algo:["Start.","Read coefficients a, b, and c for ax² + bx + c = 0.","If a is zero, report that the equation is not quadratic.","Calculate discriminant D = b² − 4ac.","For D > 0, print two real roots; for D = 0, print the repeated root; for D < 0, print the complex conjugate roots.","Stop."],flow:{type:"multi",input:"Read a, b, c",condition:"Check a and discriminant D",arms:["a = 0: report invalid quadratic","D > 0: print two real roots","D = 0: print repeated real root","D < 0: print complex conjugates"],tail:"Stop"},code:`#include <math.h>\n#include <stdio.h>\n\nint main(void) {\n    double a, b, c, d, real, imag;\n    printf("Enter coefficients a b c: ");\n    if (scanf("%lf %lf %lf", &a, &b, &c) != 3) return 1;\n    if (a == 0.0) {\n        printf("The equation is not quadratic (a must not be 0).\\n");\n        return 1;\n    }\n\n    d = b * b - 4.0 * a * c;\n    if (d > 0.0) {\n        printf("Roots = %.4f and %.4f\\n",\n               (-b + sqrt(d)) / (2 * a), (-b - sqrt(d)) / (2 * a));\n    } else if (d == 0.0) {\n        printf("Repeated root = %.4f\\n", -b / (2 * a));\n    } else {\n        real = -b / (2 * a);\n        imag = sqrt(-d) / (2 * a);\n        printf("Roots = %.4f + %.4fi and %.4f - %.4fi\\n",\n               real, fabs(imag), real, fabs(imag));\n    }\n    return 0;\n}`},
{title:"Palindrome number",category:"Number logic",algo:["Start.","Read an integer and save the original value.","Reverse its digits using remainder and integer division.","If the reversed value equals the original, display palindrome; otherwise, display not palindrome.","Stop."],flow:{type:"decision",input:"Read n and save original",condition:"Does reverse(n) equal n?",yes:"Display palindrome",no:"Display not palindrome"},code:`#include <stdio.h>\n\nint main(void) {\n    int n, original, value, reverse = 0;\n    printf("Enter a non-negative integer: ");\n    if (scanf("%d", &n) != 1 || n < 0) return 1;\n    original = value = n;\n\n    while (value > 0) {\n        reverse = reverse * 10 + value % 10;\n        value /= 10;\n    }\n    if (reverse == original)\n        printf("%d is a palindrome\\n", original);\n    else\n        printf("%d is not a palindrome\\n", original);\n    return 0;\n}`},
{title:"Floyd’s triangle",category:"Loops & patterns",algo:["Start.","Read the number of rows; set the next value to 1.","For each row i, print i consecutive values, increasing the value each time.","Move to a new line after each row; stop after all rows."],flow:{type:"loop",init:"Set value = 1; row = 1",condition:"Are all rows printed?",body:"Print row consecutive values",update:"Advance row; value increases per item",done:"Stop"},code:`#include <stdio.h>\n\nint main(void) {\n    int rows, value = 1;\n    printf("Enter number of rows (1-20): ");\n    if (scanf("%d", &rows) != 1 || rows < 1 || rows > 20) return 1;\n\n    for (int i = 1; i <= rows; i++) {\n        for (int j = 1; j <= i; j++)\n            printf("%d ", value++);\n        printf("\\n");\n    }\n    return 0;\n}`},
{title:"Arithmetic operations using switch",category:"Conditions",algo:["Start.","Read two numbers and an operator (+, −, ×, or ÷).","Use switch to select the matching calculation.","For division, check that the second number is not zero.","Display the result or an error; stop."],flow:{type:"multi",input:"Read a, operator, b",condition:"Select operator",arms:["+ : calculate a + b","− : calculate a − b","× : calculate a × b","÷ : check b ≠ 0, then calculate"],tail:"Print result or error"},code:`#include <stdio.h>\n\nint main(void) {\n    double a, b;\n    char op;\n    printf("Enter: number operator number (example: 8 / 2): ");\n    if (scanf("%lf %c %lf", &a, &op, &b) != 3) return 1;\n\n    switch (op) {\n        case '+': printf("Result = %.2f\\n", a + b); break;\n        case '-': printf("Result = %.2f\\n", a - b); break;\n        case '*': printf("Result = %.2f\\n", a * b); break;\n        case '/':\n            if (b == 0.0) printf("Error: division by zero.\\n");\n            else printf("Result = %.2f\\n", a / b);\n            break;\n        default: printf("Unsupported operator.\\n");\n    }\n    return 0;\n}`},
{title:"Print n prime numbers",category:"Loops & patterns",algo:["Start.","Read the required count n; set candidate to 2 and count to 0.","For each candidate, test divisors from 2 through its square root.","If no divisor is found, print the candidate and increment count.","Advance the candidate and repeat until n primes are printed; stop."],flow:{type:"loop",init:"candidate = 2; count = 0",condition:"Have n primes been printed?",body:"Test candidate; print it if prime",update:"candidate++; update count if prime",done:"Stop"},code:`#include <stdio.h>\n\nint is_prime(int n) {\n    if (n < 2) return 0;\n    for (int d = 2; d <= n / d; d++)\n        if (n % d == 0) return 0;\n    return 1;\n}\n\nint main(void) {\n    int n, candidate = 2, count = 0;\n    printf("How many primes? ");\n    if (scanf("%d", &n) != 1 || n < 1 || n > 1000) return 1;\n\n    while (count < n) {\n        if (is_prime(candidate)) {\n            printf("%d ", candidate);\n            count++;\n        }\n        candidate++;\n    }\n    printf("\\n");\n    return 0;\n}`},
{title:"Fibonacci series with while",category:"Loops & patterns",algo:["Start.","Read the number of terms (at most 93 for 64-bit values).","Initialize first = 0, second = 1, and count = 0.","While count is below n, print first, calculate next = first + second, shift the pair, and increment count.","Stop."],flow:{type:"loop",init:"first = 0; second = 1; count = 0",condition:"Is count less than n?",body:"Print first; next = first + second",update:"Shift pair; count++",done:"Stop"},code:`#include <stdio.h>\n\nint main(void) {\n    int n, count = 0;\n    unsigned long long first = 0, second = 1, next;\n    printf("Enter number of terms (0-93): ");\n    if (scanf("%d", &n) != 1 || n < 0 || n > 93) return 1;\n\n    while (count < n) {\n        printf("%llu ", first);\n        next = first + second;\n        first = second;\n        second = next;\n        count++;\n    }\n    printf("\\n");\n    return 0;\n}`},
{title:"Display n numbers with do–while",category:"Loops & patterns",algo:["Start.","Read n, the number of values to display.","Set counter to 1.","Use a do–while loop to print the counter and increment it until counter exceeds n.","Stop."],flow:{type:"loop",init:"Set counter = 1",condition:"Is counter ≤ n?",body:"Print counter",update:"counter++",done:"Stop"},code:`#include <stdio.h>\n\nint main(void) {\n    int n, i = 1;\n    printf("How many numbers (0-1000)? ");\n    if (scanf("%d", &n) != 1 || n < 0 || n > 1000) return 1;\n\n    if (n > 0) {\n        do {\n            printf("%d ", i);\n            i++;\n        } while (i <= n);\n    }\n    printf("\\n");\n    return 0;\n}`},
{title:"Factorial with a loop",category:"Loops & patterns",algo:["Start.","Read n from 0 to 20; set factorial to 1.","For each integer i from 1 through n, multiply factorial by i.","Display factorial and stop."],flow:{type:"loop",init:"Set factorial = 1; i = 1",condition:"Is i ≤ n?",body:"factorial = factorial × i",update:"i++",done:"Print factorial"},code:`#include <stdio.h>\n\nint main(void) {\n    int n;\n    unsigned long long factorial = 1;\n    printf("Enter n (0-20): ");\n    if (scanf("%d", &n) != 1 || n < 0 || n > 20) return 1;\n\n    for (int i = 1; i <= n; i++)\n        factorial *= (unsigned long long)i;\n    printf("%d! = %llu\\n", n, factorial);\n    return 0;\n}`},
{title:"Factorial using recursion",category:"Functions & recursion",algo:["Start.","Read n from 0 to 20.","Call factorial(n). If n is 0 or 1, return 1; otherwise return n × factorial(n − 1).","Display the returned value and stop."],flow:{type:"decision",input:"Read n (0–20)",condition:"Is n ≤ 1?",yes:"Return 1 (base case)",no:"Return n × factorial(n − 1)",tail:"Print factorial(n)"},code:`#include <stdio.h>\n\nunsigned long long factorial(unsigned int n) {\n    if (n <= 1) return 1;\n    return n * factorial(n - 1);\n}\n\nint main(void) {\n    int n;\n    printf("Enter n (0-20): ");\n    if (scanf("%d", &n) != 1 || n < 0 || n > 20) return 1;\n    printf("%d! = %llu\\n", n, factorial((unsigned int)n));\n    return 0;\n}`},
{title:"Multiplication table with for",category:"Loops & patterns",algo:["Start.","Read a number n.","For i from 1 through 10, display n × i = product.","Stop."],flow:{type:"loop",init:"Set i = 1",condition:"Is i ≤ 10?",body:"Print n × i",update:"i++",done:"Stop"},code:`#include <stdio.h>\n\nint main(void) {\n    int n;\n    printf("Enter a number: ");\n    if (scanf("%d", &n) != 1) return 1;\n\n    for (int i = 1; i <= 10; i++)\n        printf("%d x %d = %d\\n", n, i, n * i);\n    return 0;\n}`},
{title:"Sum array elements using pointers",category:"Arrays & pointers",algo:["Start.","Read the array size and its elements.","Set a pointer to the first element and sum to 0.","Visit each element through pointer arithmetic, adding it to sum.","Display sum and stop."],flow:{type:"loop",init:"Set pointer = first element; sum = 0",condition:"Are elements remaining?",body:"sum += *pointer",update:"pointer++",done:"Print sum"},code:`#include <stdio.h>\n\nint main(void) {\n    int a[100], n, sum = 0;\n    printf("Enter array size (1-100): ");\n    if (scanf("%d", &n) != 1 || n < 1 || n > 100) return 1;\n    printf("Enter %d integers: ", n);\n    for (int i = 0; i < n; i++)\n        if (scanf("%d", &a[i]) != 1) return 1;\n\n    for (int *p = a; p < a + n; p++)\n        sum += *p;\n    printf("Sum = %d\\n", sum);\n    return 0;\n}`},
{title:"Display array elements",category:"Arrays & pointers",algo:["Start.","Read the array size and elements.","Traverse from the first to the last index and print each element.","Stop."],flow:{type:"loop",init:"Read array; set i = 0",condition:"Is i less than n?",body:"Print a[i]",update:"i++",done:"Stop"},code:`#include <stdio.h>\n\nint main(void) {\n    int a[100], n;\n    printf("Enter array size (1-100): ");\n    if (scanf("%d", &n) != 1 || n < 1 || n > 100) return 1;\n    printf("Enter %d integers: ", n);\n    for (int i = 0; i < n; i++)\n        if (scanf("%d", &a[i]) != 1) return 1;\n\n    printf("Array: ");\n    for (int i = 0; i < n; i++) printf("%d ", a[i]);\n    printf("\\n");\n    return 0;\n}`},
{title:"Insert an element into an array",category:"Arrays & pointers",algo:["Start.","Read n elements, then read the new value and its 1-based insertion position.","Validate that position is from 1 to n + 1 and that capacity is available.","Shift elements right from the end to the insertion position.","Store the new value, display the updated array, and stop."],flow:{type:"loop",init:"Read array, value, and position",condition:"Are elements at/after position unshifted?",body:"Move a[i−1] to a[i]",update:"Move index left",done:"Insert value; print array"},code:`#include <stdio.h>\n\nint main(void) {\n    int a[101], n, value, position;\n    printf("Enter array size (1-100): ");\n    if (scanf("%d", &n) != 1 || n < 1 || n > 100) return 1;\n    printf("Enter %d integers: ", n);\n    for (int i = 0; i < n; i++)\n        if (scanf("%d", &a[i]) != 1) return 1;\n    printf("Enter value and 1-based insertion position: ");\n    if (scanf("%d %d", &value, &position) != 2 ||\n        position < 1 || position > n + 1) return 1;\n\n    for (int i = n; i >= position; i--) a[i] = a[i - 1];\n    a[position - 1] = value;\n    n++;\n    for (int i = 0; i < n; i++) printf("%d ", a[i]);\n    printf("\\n");\n    return 0;\n}`},
{title:"Merge two arrays",category:"Arrays & pointers",algo:["Start.","Read the sizes and values of arrays A and B.","Copy A into the beginning of the result array.","Copy B immediately after A.","Display the merged array and stop."],flow:["Start","Read arrays A and B","Copy A, then append B","Display merged array","Stop"],note:"This interprets “merge” as concatenating the two arrays in their original order; it does not sort them.",code:`#include <stdio.h>\n\nint main(void) {\n    int a[100], b[100], merged[200], n, m;\n    printf("Enter sizes of A and B (1-100 each): ");\n    if (scanf("%d %d", &n, &m) != 2 || n < 1 || n > 100 || m < 1 || m > 100) return 1;\n    printf("Enter %d values for A: ", n);\n    for (int i = 0; i < n; i++) if (scanf("%d", &a[i]) != 1) return 1;\n    printf("Enter %d values for B: ", m);\n    for (int i = 0; i < m; i++) if (scanf("%d", &b[i]) != 1) return 1;\n\n    for (int i = 0; i < n; i++) merged[i] = a[i];\n    for (int i = 0; i < m; i++) merged[n + i] = b[i];\n    printf("Merged array: ");\n    for (int i = 0; i < n + m; i++) printf("%d ", merged[i]);\n    printf("\\n");\n    return 0;\n}`},

{title:"Product of two matrices",category:"Matrices",algo:["Start.","Read dimensions and values of A (r1 × c1) and B (r2 × c2).","If c1 is not equal to r2, report that multiplication is not possible.","Initialize each result cell to 0; accumulate A[i][k] × B[k][j].","Display the r1 × c2 product matrix and stop."],flow:{type:"decision",input:"Read matrix dimensions and values",condition:"Is columns(A) equal to rows(B)?",yes:"Compute each product cell",no:"Display incompatible dimensions",tail:"Print product matrix"},code:`#include <stdio.h>\n#define MAX 10\n\nint main(void) {\n    int a[MAX][MAX], b[MAX][MAX], product[MAX][MAX] = {{0}};\n    int r1, c1, r2, c2;\n    printf("Enter rows and columns of A: ");\n    if (scanf("%d %d", &r1, &c1) != 2 || r1 < 1 || r1 > MAX || c1 < 1 || c1 > MAX) return 1;\n    printf("Enter rows and columns of B: ");\n    if (scanf("%d %d", &r2, &c2) != 2 || r2 < 1 || r2 > MAX || c2 < 1 || c2 > MAX) return 1;\n    if (c1 != r2) { printf("Multiplication is not possible.\\n"); return 1; }\n    printf("Enter matrix A:\\n");\n    for (int i = 0; i < r1; i++) for (int j = 0; j < c1; j++)\n        if (scanf("%d", &a[i][j]) != 1) return 1;\n    printf("Enter matrix B:\\n");\n    for (int i = 0; i < r2; i++) for (int j = 0; j < c2; j++)\n        if (scanf("%d", &b[i][j]) != 1) return 1;\n\n    for (int i = 0; i < r1; i++) for (int j = 0; j < c2; j++)\n        for (int k = 0; k < c1; k++) product[i][j] += a[i][k] * b[k][j];\n    printf("Product matrix:\\n");\n    for (int i = 0; i < r1; i++) {\n        for (int j = 0; j < c2; j++) printf("%d ", product[i][j]);\n        printf("\\n");\n    }\n    return 0;\n}`},
{title:"Transpose a matrix",category:"Matrices",algo:["Start.","Read the matrix dimensions and elements.","For every element A[i][j], assign transpose[j][i] = A[i][j].","Display the transposed matrix, whose dimensions are columns × rows; stop."],flow:{type:"loop",init:"Read matrix; prepare transpose",condition:"Are input cells remaining?",body:"transpose[j][i] = A[i][j]",update:"Advance row/column",done:"Print transposed matrix"},note:"The source says “transpose of a number.” Since transpose is an operation on matrices and the cycle includes matrix exercises, this solution interprets it as matrix transpose.",code:`#include <stdio.h>\n#define MAX 10\n\nint main(void) {\n    int a[MAX][MAX], t[MAX][MAX], rows, cols;\n    printf("Enter rows and columns (1-10): ");\n    if (scanf("%d %d", &rows, &cols) != 2 || rows < 1 || rows > MAX || cols < 1 || cols > MAX) return 1;\n    printf("Enter matrix elements:\\n");\n    for (int i = 0; i < rows; i++) for (int j = 0; j < cols; j++)\n        if (scanf("%d", &a[i][j]) != 1) return 1;\n\n    for (int i = 0; i < rows; i++) for (int j = 0; j < cols; j++)\n        t[j][i] = a[i][j];\n    printf("Transpose:\\n");\n    for (int i = 0; i < cols; i++) {\n        for (int j = 0; j < rows; j++) printf("%d ", t[i][j]);\n        printf("\\n");\n    }\n    return 0;\n}`},

{title:"Cylinder volume and surface area with functions",category:"Functions & recursion",algo:["Start.","Read cylinder radius and height.","Call a function that calculates volume = πr²h and total surface area = 2πr(r + h).","Display both values and stop."],flow:["Start","Read radius and height","Call cylinder function","Calculate volume and total surface area","Display results","Stop"],code:`#include <stdio.h>\n\nvoid cylinder(double r, double h, double *volume, double *surface) {\n    const double pi = 3.141592653589793;\n    *volume = pi * r * r * h;\n    *surface = 2 * pi * r * (r + h);\n}\n\nint main(void) {\n    double radius, height, volume, surface;\n    printf("Enter radius and height: ");\n    if (scanf("%lf %lf", &radius, &height) != 2 || radius < 0 || height < 0) return 1;\n    cylinder(radius, height, &volume, &surface);\n    printf("Volume = %.2f\\nTotal surface area = %.2f\\n", volume, surface);\n    return 0;\n}`},

{title:"Call by value and call by reference",category:"Functions & recursion",algo:["Start.","Read two integers a and b.","Pass copies to a value-swap function; the caller’s values stay unchanged.","Pass addresses to a pointer-based swap function; the caller’s values are exchanged.","Display values before and after each call; stop."],flow:["Start","Read a and b","Call swap-by-value (caller unchanged)","Call pointer-based swap (caller values change)","Display results","Stop"],note:"C passes arguments by value. “Call by reference” is demonstrated with pointers, which let a function update the caller’s variables.",code:`#include <stdio.h>\n\nvoid swap_by_value(int x, int y) {\n    int temp = x; x = y; y = temp;\n    printf("Inside value function: x = %d, y = %d\\n", x, y);\n}\n\nvoid swap_by_pointer(int *x, int *y) {\n    int temp = *x; *x = *y; *y = temp;\n}\n\nint main(void) {\n    int a, b;\n    printf("Enter two integers: ");\n    if (scanf("%d %d", &a, &b) != 2) return 1;\n    printf("Before calls: a = %d, b = %d\\n", a, b);\n    swap_by_value(a, b);\n    printf("After value call: a = %d, b = %d\\n", a, b);\n    swap_by_pointer(&a, &b);\n    printf("After pointer call: a = %d, b = %d\\n", a, b);\n    return 0;\n}`},
{title:"Classify a quadrilateral as square or rectangle",category:"Geometry & sorting",algo:["Start.","Read four vertices in boundary order (clockwise or counter-clockwise).","Calculate side lengths, diagonal lengths, and the two diagonal midpoints.","Confirm that opposite sides match and that diagonals bisect each other and have equal lengths.","If rectangle conditions hold and all four sides are equal, report square; otherwise report rectangle or neither.","Stop."],flow:{type:"decision",input:"Read four ordered vertices",condition:"Do rectangle checks pass?",yes:"If all sides equal: square; otherwise rectangle",no:"Report neither square nor rectangle",tail:"Stop"},note:"Vertices must be entered around the quadrilateral’s boundary. This checks rectangle geometry using equal opposite sides and diagonals that bisect each other and have equal lengths.",code:`#include <math.h>\n#include <stdio.h>\n\nstruct Point { double x, y; };\ndouble dist2(struct Point a, struct Point b) {\n    double dx = a.x - b.x, dy = a.y - b.y;\n    return dx * dx + dy * dy;\n}\nint close_to(double a, double b) {\n    return fabs(a - b) <= 1e-8 * fmax(1.0, fmax(fabs(a), fabs(b)));\n}\n\nint main(void) {\n    struct Point p[4];\n    double s[4], d1, d2;\n    printf("Enter four vertices in boundary order (x y):\\n");\n    for (int i = 0; i < 4; i++)\n        if (scanf("%lf %lf", &p[i].x, &p[i].y) != 2) return 1;\n    for (int i = 0; i < 4; i++) s[i] = dist2(p[i], p[(i + 1) % 4]);\n    d1 = dist2(p[0], p[2]);\n    d2 = dist2(p[1], p[3]);\n    int bisect = close_to(p[0].x + p[2].x, p[1].x + p[3].x) &&\n                 close_to(p[0].y + p[2].y, p[1].y + p[3].y);\n    int rectangle = bisect && close_to(d1, d2) &&\n                    close_to(s[0], s[2]) && close_to(s[1], s[3]);\n\n    if (rectangle && close_to(s[0], s[1])) printf("Square\\n");\n    else if (rectangle) printf("Rectangle (not square)\\n");\n    else printf("Neither a square nor a rectangle\\n");\n    return 0;\n}`},
{title:"Sort numbers in ascending order",category:"Geometry & sorting",algo:["Start.","Read n values into an array.","Compare neighboring elements; swap them if they are out of ascending order.","Repeat passes until the array is sorted.","Display the sorted values and stop."],flow:{type:"loop",init:"Read array; set pass = 0",condition:"Are sorting passes remaining?",body:"Compare neighbors; swap if left > right",update:"Advance index and pass",done:"Print sorted array"},code:`#include <stdio.h>\n\nint main(void) {\n    int a[100], n;\n    printf("Enter array size (1-100): ");\n    if (scanf("%d", &n) != 1 || n < 1 || n > 100) return 1;\n    printf("Enter %d integers: ", n);\n    for (int i = 0; i < n; i++)\n        if (scanf("%d", &a[i]) != 1) return 1;\n\n    for (int i = 0; i < n - 1; i++)\n        for (int j = 0; j < n - 1 - i; j++)\n            if (a[j] > a[j + 1]) {\n                int temp = a[j]; a[j] = a[j + 1]; a[j + 1] = temp;\n            }\n    printf("Ascending order: ");\n    for (int i = 0; i < n; i++) printf("%d ", a[i]);\n    printf("\\n");\n    return 0;\n}`},
{title:"Largest of three numbers using pointers",category:"Arrays & pointers",algo:["Start.","Read three integers and pass their addresses to a function.","Dereference the pointers and compare the three values.","Return and display the largest value; stop."],flow:["Start","Read a, b, c","Pass their addresses to largest()","Compare values through pointers","Display largest","Stop"],code:`#include <stdio.h>\n\nint largest(const int *a, const int *b, const int *c) {\n    int max = *a;\n    if (*b > max) max = *b;\n    if (*c > max) max = *c;\n    return max;\n}\n\nint main(void) {\n    int a, b, c;\n    printf("Enter three integers: ");\n    if (scanf("%d %d %d", &a, &b, &c) != 3) return 1;\n    printf("Largest = %d\\n", largest(&a, &b, &c));\n    return 0;\n}`},
{title:"Elapsed time between two dates",category:"Structures & records",algo:["Start.","Read two dates in DD/MM/YYYY format into Date records.","Validate day, month, and year, including leap-year February.","Convert each date to a day count from a common origin.","Take the absolute difference and display elapsed whole days; stop."],flow:{type:"decision",input:"Read two dates",condition:"Are both dates valid?",yes:"Convert to day counts; take absolute difference",no:"Display invalid date",tail:"Print elapsed days"},note:"This reports the absolute difference in whole calendar days. The first date can be earlier or later than the second.",code:`#include <stdio.h>\n#include <stdlib.h>\n\nstruct Date { int day, month, year; };\nint leap(int y) { return y % 400 == 0 || (y % 4 == 0 && y % 100 != 0); }\nint valid(struct Date d) {\n    int days[] = {0,31,28,31,30,31,30,31,31,30,31,30,31};\n    if (d.year < 1 || d.month < 1 || d.month > 12) return 0;\n    int max = days[d.month] + (d.month == 2 && leap(d.year));\n    return d.day >= 1 && d.day <= max;\n}\nlong long day_number(struct Date d) {\n    long long y = d.year - 1;\n    long long days = 365 * y + y / 4 - y / 100 + y / 400;\n    int month_days[] = {0,31,28,31,30,31,30,31,31,30,31,30,31};\n    for (int m = 1; m < d.month; m++)\n        days += month_days[m] + (m == 2 && leap(d.year));\n    return days + d.day;\n}\n\nint main(void) {\n    struct Date a, b;\n    printf("Enter first date (DD/MM/YYYY): ");\n    if (scanf("%d/%d/%d", &a.day, &a.month, &a.year) != 3) return 1;\n    printf("Enter second date (DD/MM/YYYY): ");\n    if (scanf("%d/%d/%d", &b.day, &b.month, &b.year) != 3) return 1;\n    if (!valid(a) || !valid(b)) { printf("Invalid date.\\n"); return 1; }\n\n    long long elapsed = llabs(day_number(a) - day_number(b));\n    printf("Elapsed time = %lld day(s)\\n", elapsed);\n    return 0;\n}`}

const groups = ["Fundamentals","Conditions","Formulas","Number logic","Loops & patterns","Arrays & pointers","Matrices","Functions & recursion","Structures & records","Geometry & sorting"];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
let selected = -1, query = "";
const listEl = document.getElementById("programList"), mainEl = document.getElementById("main"), searchEl = document.getElementById("search");
function filtered() { const q=query.trim().toLowerCase(); return programs.map((p,i)=>({p,i})).filter(({p})=>!q || (p.title+" "+p.category+" "+p.algo.join(" ")).toLowerCase().includes(q)); }
function renderList(){
  const matches=filtered(); let html="";
  for(const g of groups){ const items=matches.filter(x=>x.p.category===g); if(!items.length)continue;
    html+=`<div class="group-title">${esc(g)}</div>`;
    html+=items.map(({p,i})=>`<button class="program-link ${selected===i?"active":""}" data-id="${i}"><span class="program-num">${String(i+1).padStart(2,"0")}</span><span>${esc(p.title)}</span></button>`).join("");
  }
  listEl.innerHTML=html||'<div class="empty">No programs match your search.</div>';
  listEl.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>openProgram(Number(b.dataset.id))));
}
function nodeShape(x,y,w,h,type,label,terminal=false){
  const lines=wrap(label, Math.min(type==="decision"?24:40,Math.max(14,Math.floor(w/7)))).slice(0,3), lineH=15, startY=y-(lines.length-1)*lineH/2+4;
  let shape;
  if(type==="decision") shape=`<polygon class="decision" points="${x},${y-h/2} ${x+w/2},${y} ${x},${y+h/2} ${x-w/2},${y}"/>`;
  else if(terminal) shape=`<rect class="terminal" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}"/>`;
  else if(type==="io") shape=`<polygon class="io" points="${x-w/2+12},${y-h/2} ${x+w/2},${y-h/2} ${x+w/2-12},${y+h/2} ${x-w/2},${y+h/2}"/>`;
  else shape=`<rect class="node" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="9"/>`;
  return `${shape}<text text-anchor="middle" x="${x}" y="${startY}" ${terminal?'class="terminal-text"':''}>${lines.map((t,i)=>`<tspan x="${x}" dy="${i?lineH:0}">${esc(t)}</tspan>`).join("")}</text>`;
}
function wrap(text,max){const words=String(text).split(/\s+/),out=[];let line="";for(const w of words){if((line+" "+w).trim().length>max&&line){out.push(line);line=w}else line=(line+" "+w).trim()}if(line)out.push(line);return out}
function arrow(x1,y1,x2,y2,label="") {let mid=(y1+y2)/2;return `<path class="edge" marker-end="url(#arrow)" d="M${x1},${y1} L${x1},${mid} L${x2},${mid} L${x2},${y2}"/>${label?`<text class="edge-label" x="${(x1+x2)/2+6}" y="${mid-4}">${esc(label)}</text>`:""}`}
function renderFlow(flow){
  const defs='<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b877a"/></marker></defs>';
  if(Array.isArray(flow)){
    const W=610,H=flow.length*76+25,cx=W/2,w=390,h=48;let s=`<svg class="flow-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Flowchart">${defs}`;
    flow.forEach((label,i)=>{const y=36+i*76; if(i)s+=arrow(cx,36+(i-1)*76+h/2,cx,y-h/2);s+=nodeShape(cx,y,w,h,i===0||i===flow.length-1?"terminal":"process",label,i===0||i===flow.length-1)});
    return s+"</svg>";
  }
  if(flow.type==="decision"){
    const W=720,H=480,cx=360;let s=`<svg class="flow-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Flowchart">${defs}`;
    s+=nodeShape(cx,39,170,42,"terminal","Start",true);s+=arrow(cx,60,cx,78);s+=nodeShape(cx,103,280,48,"io",flow.input);s+=arrow(cx,127,cx,147);s+=nodeShape(cx,187,300,76,"decision",flow.condition);
    s+=arrow(cx-67,213,180,256,"Yes");s+=arrow(cx+67,213,540,256,"No");s+=nodeShape(180,283,225,52,"process",flow.yes);s+=nodeShape(540,283,225,52,"process",flow.no);
    const bottom=flow.tail||"Display result";s+=`<path class="edge" marker-end="url(#arrow)" d="M180 309 L180 340 L360 340 L360 357"/><path class="edge" marker-end="url(#arrow)" d="M540 309 L540 340 L360 340 L360 357"/>`;
    s+=nodeShape(cx,382,330,48,"io",bottom);s+=arrow(cx,406,cx,435);s+=nodeShape(cx,456,124,42,"terminal","Stop",true);
    return s+"</svg>";
  }
  if(flow.type==="loop"){
    const W=720,H=520,cx=320;let s=`<svg class="flow-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Flowchart">${defs}`;
    s+=nodeShape(cx,34,150,42,"terminal","Start",true);s+=arrow(cx,55,cx,69);s+=nodeShape(cx,94,355,48,"process",flow.init);s+=arrow(cx,118,cx,133);s+=nodeShape(cx,176,330,74,"decision",flow.condition);
    s+=arrow(cx-73,201,200,257,"Yes");s+=nodeShape(200,285,260,54,"process",flow.body);s+=arrow(200,312,200,332);s+=nodeShape(200,356,260,48,"process",flow.update);
    s+=`<path class="edge" marker-end="url(#arrow)" d="M70 356 L35 356 L35 176 L153 176"/><text class="edge-label" x="42" y="263">Repeat</text>`;
    s+=arrow(cx+73,201,555,256,"No");s+=nodeShape(555,284,220,52,"io",flow.done);s+=arrow(555,310,555,350);s+=nodeShape(555,380,130,42,"terminal","Stop",true);
    return s+"</svg>";
  }
  if(flow.type==="multi"){
    const W=800,H=500,cx=400,arms=flow.arms,top=244,gap=arms.length>4?130:170,armW=arms.length>4?120:150;let s=`<svg class="flow-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Flowchart">${defs}`;
    s+=nodeShape(cx,35,150,42,"terminal","Start",true);s+=arrow(cx,56,cx,72);s+=nodeShape(cx,96,310,48,"io",flow.input);s+=arrow(cx,120,cx,139);s+=nodeShape(cx,180,340,72,"decision",flow.condition);
    const start=(W-(arms.length-1)*gap)/2;
    s+=`<path class="edge" d="M${cx} 216 L${cx} 237"/>`;
    arms.forEach((arm,i)=>{const x=start+i*gap;s+=`<path class="edge" marker-end="url(#arrow)" d="M${cx} 237 L${x} 237 L${x} ${top-30}"/>`;s+=`<text class="edge-label" x="${x-12}" y="232">${i+1}</text>`;s+=nodeShape(x,top,armW,72,"process",arm);s+=`<path class="edge" marker-end="url(#arrow)" d="M${x} ${top+36} L${x} 355 L${cx} 355 L${cx} 380"/>`});
    s+=nodeShape(cx,405,360,48,"io",flow.tail||"Display result");s+=arrow(cx,429,cx,444);s+=nodeShape(cx,465,120,42,"terminal","Stop",true);
    return s+"</svg>";
  }
  return "";
}
function showHome(){selected=-1;renderList();mainEl.innerHTML=`<section class="hero"><div class="eyebrow">BCA (Honours) · C Programming Lab Cycle</div><h1>Learn the logic.<br>Trace the flow.</h1><p>Forty lab exercises, each with a step-by-step algorithm, a visual flowchart, and a complete C99 program you can study and adapt.</p><div class="hero-bottom"><span class="pill"><i class="lime-dot"></i>40 complete programs</span><span class="pill">Algorithms + flowcharts</span><span class="pill">Searchable study guide</span></div></section><div class="stats"><div class="stat"><b>40</b><span>lab exercises</span></div><div class="stat"><b>10</b><span>topic groups</span></div><div class="stat"><b>C99</b><span>standard used</span></div></div><p class="intro">Choose an exercise from the left or search by topic. Each program includes input checks and comments where they help explain the logic. Compile with a C99 compiler; programs using math functions may need the math library (for GCC, add <code>-lm</code>).</p><div class="category-grid">${groups.map(g=>{const n=programs.filter(p=>p.category===g).length;return `<button class="category-card" data-group="${esc(g)}"><span class="count">${String(n).padStart(2,"0")} EXERCISES</span><h3>${esc(g)}</h3><p>${categoryDesc(g)}</p></button>`}).join("")}</div><div class="section-heading"><div><h2>All programs</h2><p>Open any solution to see its algorithm, diagram, and code.</p></div><span class="tag">40 EXERCISES</span></div><div class="catalog">${programs.map((p,i)=>`<button class="catalog-card" data-id="${i}"><span class="catalog-num">${String(i+1).padStart(2,"0")}</span><span><strong>${esc(p.title)}</strong><small>${esc(p.category)}</small></span></button>`).join("")}</div><div class="footer"><span>Prepared from the supplied C Programming Lab Cycle.</span><span>Study the algorithm before tracing the code.</span></div>`;
  mainEl.querySelector(".hero").insertAdjacentHTML("afterbegin",`<div class="hero-art" aria-hidden="true"><div class="hero-orbit"></div><div class="hero-screen"><div class="screen-top"><i class="screen-dot"></i><i class="screen-dot"></i><i class="screen-dot"></i><span class="screen-label">c-lab / editor</span></div><div class="screen-code"><span class="screen-line"><i>01</i><b>int</b> main(void) {</span><span class="screen-line"><i>02</i><em>while</em> (logic) {</span><span class="screen-line"><i>03</i>trace_the_flow();</span><span class="screen-line"><i>04</i>}</span><span class="screen-line"><i>05</i><b>return</b> 0;</span><span class="screen-line"><i>06</i>}</span></div><div class="screen-footer">C99 · READY TO COMPILE</div></div><div class="hero-cube"><span class="cube-face cube-front">C</span><span class="cube-face cube-back">{ }</span><span class="cube-face cube-right">01</span><span class="cube-face cube-left">→</span><span class="cube-face cube-top">*</span><span class="cube-face cube-bottom">;</span></div><div class="hero-chip">40 PROGRAMS&nbsp; / &nbsp;10 TOPICS</div></div>`);
  mainEl.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>openProgram(Number(b.dataset.id))));
  mainEl.querySelectorAll("[data-group]").forEach(b=>b.addEventListener("click",()=>{query=b.dataset.group;searchEl.value=query;renderList();document.querySelector(".sidebar").classList.add("open")}));
}
function categoryDesc(g){return ({"Fundamentals":"Core input, output, and variable operations.","Conditions":"Decisions, comparisons, and switch statements.","Formulas":"Direct calculations from common equations.","Number logic":"Digit operations and numerical checks.","Loops & patterns":"Iteration, series, tables, and patterns.","Arrays & pointers":"Working with indexed and pointer-based data.","Matrices":"Two-dimensional arrays and matrix operations.","Functions & recursion":"Reusable functions and recursive calls.","Structures & records":"Collect related values into records.","Geometry & sorting":"Coordinate geometry and ordering data."})[g]}
function highlight(code){return esc(code).split("\n").map(line=>{const m=line.match(/^(\s*\/\/.*)$/);if(m)return `<span class="com">${line}</span>`;return line.replace(/(&quot;.*?&quot;)/g,'<span class="str">$1</span>').replace(/\b(int|double|char|long|void|return|if|else|for|while|do|switch|case|break|struct|const|unsigned|static|define|include)\b/g,'<span class="kw">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="num">$1</span>')}).join("\n")}
function openProgram(i){selected=i;renderList();document.querySelector(".sidebar").classList.remove("open");const p=programs[i];mainEl.innerHTML=`<div class="crumb"><a href="#" id="homeLink">C Programming Lab</a> / ${esc(p.category)} / Exercise ${String(i+1).padStart(2,"0")}</div><div class="program-head"><div><h1 class="program-title">${String(i+1).padStart(2,"0")}. ${esc(p.title)}</h1><p class="program-description">A complete solution with the procedure and logic visualized below.</p></div><span class="tag">${esc(p.category)}</span></div>${p.note?`<div class="note"><strong>Note:</strong> ${esc(p.note)}</div>`:""}<div class="content-grid"><section class="panel"><div class="panel-head"><div><div class="panel-kicker">Step by step</div><h2>Algorithm</h2></div><span class="tag">${p.algo.length} STEPS</span></div><ol class="algorithm">${p.algo.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></section><section class="panel"><div class="panel-head"><div><div class="panel-kicker">Program logic</div><h2>Flowchart</h2></div><span class="panel-kicker">Start → Stop</span></div><div class="flow-stage">${renderFlow(p.flow)}</div></section><section class="panel code-panel"><div class="panel-head"><div><div class="panel-kicker">Standard C99</div><h2>Program code</h2></div><div class="code-actions"><button class="copy-btn" id="copyBtn">Copy code</button><button class="download-btn" id="downloadBtn">Download .c</button></div></div><div class="code-wrap"><code class="code" id="codeBlock">${highlight(p.code)}</code></div></section></div><div class="bottom-nav"><button class="nav-btn" id="prevBtn" ${i===0?"disabled":""}>← Previous</button><button class="nav-btn" id="nextBtn" ${i===programs.length-1?"disabled":""}>Next →</button></div><div class="footer"><span>Exercise ${i+1} of ${programs.length}</span><span>Use the copy button to paste the source into your C editor.</span></div>`;
  const sample=samples[i];
  mainEl.querySelector(".content-grid").insertAdjacentHTML("beforeend",`<section class="panel sample-panel"><div class="panel-head"><div><div class="panel-kicker">Example console run</div><h2>Sample input and output</h2></div><span class="panel-kicker">Expected result</span></div><div class="sample-grid"><div class="sample-block"><h3>Sample input</h3><pre>${esc(sample.input.join(String.fromCharCode(10)))}</pre></div><div class="sample-block output"><h3>Program output</h3><pre>${esc(sample.output.join(String.fromCharCode(10)))}</pre></div></div></section>`);
  document.getElementById("homeLink").addEventListener("click",e=>{e.preventDefault();showHome()});
  document.getElementById("copyBtn").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(p.code);toast("Code copied to clipboard")}catch{const ta=document.createElement("textarea");ta.value=p.code;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("Code copied to clipboard")}});
  document.getElementById("downloadBtn").addEventListener("click",()=>{const blob=new Blob([p.code],{type:"text/x-csrc;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`${String(i+1).padStart(2,"0")}-${slug(p.title)}.c`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("C source downloaded")});
  document.getElementById("prevBtn").addEventListener("click",()=>i>0&&openProgram(i-1));document.getElementById("nextBtn").addEventListener("click",()=>i<programs.length-1&&openProgram(i+1));window.scrollTo({top:0,behavior:"smooth"});
}
let toastTimer;function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1700)}
searchEl.addEventListener("input",()=>{query=searchEl.value;renderList();if(selected>=0&&!filtered().some(x=>x.i===selected))showHome()});
document.getElementById("menuButton").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
renderList();showHome();
</script>
